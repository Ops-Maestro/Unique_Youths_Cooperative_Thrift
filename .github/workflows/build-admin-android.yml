name: Build Admin Android APK

on:
  push:
    branches:
      - master
    paths:
      - "unique-youths-admin/**"
      - ".github/workflows/build-admin-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unique-youths-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: unique-youths-admin/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java version
        run: java -version

      - uses: android-actions/setup-android@v4

      - name: Install dependencies (exact from lockfile)
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.BACKEND_API_URL }}
          VITE_CLIENT_URL: ${{ vars.CLIENT_APP_URL }}

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";

          const config: CapacitorConfig = {
            appId: "com.uniqueyouths.admin",
            appName: "Unique Youth Admin",
            webDir: "dist",
            server: {
              url: process.env.ADMIN_APP_URL,
              cleartext: false
            }
          };

          export default config;
          EOF

      - name: Add Android platform (if not exists)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists, skipping add."
          fi

      # Upgrade Gradle wrapper to 8.7 (no trailing spaces)
      - name: Upgrade Gradle wrapper
        working-directory: unique-youths-admin/android
        run: |
          sed -i 's/gradle-8.0.2-all.zip/gradle-8.7-all.zip/g' gradle/wrapper/gradle-wrapper.properties
          # Remove any trailing spaces
          sed -i 's/[ \t]*$//' gradle/wrapper/gradle-wrapper.properties

      # Force Java 21 compatibility and resolve Kotlin duplicate class conflicts
      - name: Force Java 21 compatibility & Kotlin alignment
        working-directory: unique-youths-admin/android
        run: |
          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace "com.uniqueyouths.admin"
              compileSdkVersion rootProject.ext.compileSdkVersion
              defaultConfig {
                  applicationId "com.uniqueyouths.admin"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {
                      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }

          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.10'
                  }
              }
          }

          repositories {
              flatDir{
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
              implementation project(':capacitor-android')
              testImplementation "junit:junit:$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
              implementation project(':capacitor-cordova-android-plugins')
          }

          apply from: 'capacitor.build.gradle'

          try {
              def servicesJSON = file('google-services.json')
              if (servicesJSON.text) {
                  apply plugin: 'com.google.gms.google-services'
              }
          } catch(Exception e) {
              logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
          }
          EOF

      # Also upgrade AGP in the root build.gradle
      - name: Upgrade Android Gradle Plugin
        working-directory: unique-youths-admin/android
        run: |
          sed -i 's/classpath '\''com.android.tools.build:gradle:8.0.0'\''/classpath '\''com.android.tools.build:gradle:8.6.1'\''/g' build.gradle

      # Upgrade SDK versions in variables.gradle
      - name: Upgrade SDK versions
        working-directory: unique-youths-admin/android
        run: |
          sed -i 's/compileSdkVersion = 33/compileSdkVersion = 35/g' variables.gradle
          sed -i 's/targetSdkVersion = 33/targetSdkVersion = 35/g' variables.gradle

      - name: Copy icon for asset generation
        run: |
          mkdir -p assets
          cp public/assets/icon.png assets/icon.png

      - name: Generate Android assets
        run: npx capacitor-assets generate

      - name: Sync Capacitor Android project
        run: npx cap sync android
        env:
          ADMIN_APP_URL: ${{ vars.ADMIN_APP_URL }}

      - name: Decode signing keystore (if configured)
        id: signing
        working-directory: unique-youths-admin/android
        run: |
          if [ -n "${{ secrets.ADMIN_ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ADMIN_ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.has_keystore == 'true'
        working-directory: unique-youths-admin/android
        run: |
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ADMIN_ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ADMIN_ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ADMIN_ANDROID_KEY_PASSWORD }}"
          mkdir -p ../apk-output
          cp app/build/outputs/apk/release/app-release.apk ../apk-output/unique-youths-admin.apk

      - name: Build debug APK (no signing secrets configured)
        if: steps.signing.outputs.has_keystore == 'false'
        working-directory: unique-youths-admin/android
        run: |
          echo "::warning::No signing secrets set – building debug-signed APK."
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../apk-output
          cp app/build/outputs/apk/debug/app-debug.apk ../apk-output/unique-youths-admin.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unique-youths-admin-apk
          path: unique-youths-admin/apk-output/unique-youths-admin.apk

      - name: Update Release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d latest-admin-android || true
          git push origin :refs/tags/latest-admin-android || true
          git tag latest-admin-android
          git push origin latest-admin-android --force
        working-directory: .

      - name: Publish to "latest-admin-android" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-admin-android
          name: Latest Admin Android build
          body: Automatically built from the latest master branch.
          prerelease: false
          files: unique-youths-admin/apk-output/unique-youths-admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}