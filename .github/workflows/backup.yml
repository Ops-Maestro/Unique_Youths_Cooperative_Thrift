name: Weekly database backup

# Free alternative to MongoDB Atlas's paid Cloud Backup: hits the backend's
# /api/admin/backup/run endpoint, which dumps the core collections to JSON
# and emails them as attachments via Resend. Runs weekly - the data doesn't
# change fast enough on a small community app to need more than that, and
# GitHub Actions' scheduler being occasionally unreliable (see the
# keep-alive workflow's notes) doesn't matter much for a weekly job.
#
# Setup:
# 1. In your backend's .env (and on Render), set BACKUP_SECRET to any long
#    random string.
# 2. In this GitHub repo: Settings -> Secrets and variables -> Actions,
#    add two repository secrets:
#    - BACKUP_URL, e.g. https://your-backend.onrender.com/api/admin/backup/run
#    - BACKUP_SECRET, the exact same value you put in the backend's .env
# 3. That's it - runs automatically, and you can also trigger it manually
#    any time from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backup
        run: |
          if [ -z "${{ secrets.BACKUP_URL }}" ] || [ -z "${{ secrets.BACKUP_SECRET }}" ]; then
            echo "BACKUP_URL or BACKUP_SECRET secret is not set - skipping."
            exit 0
          fi
          curl -sf -X POST "${{ secrets.BACKUP_URL }}" \
            -H "x-backup-secret: ${{ secrets.BACKUP_SECRET }}"
