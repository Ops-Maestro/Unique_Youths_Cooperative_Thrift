name: Keep backend awake

# Render's free tier fully suspends a web service after ~15 minutes with no
# traffic, and the next request has to wait ~30-60s for it to wake back up.
# A ping from *inside* the app can't fix this (the process itself is asleep),
# so this pings the public /health endpoint from GitHub's servers on a
# schedule to keep it warm during hours people are likely to be using it.
#
# Setup:
# 1. In the GitHub repo, go to Settings -> Secrets and variables -> Actions
# 2. Add a repository secret named BACKEND_HEALTH_URL, e.g.
#    https://your-backend.onrender.com/health
# 3. That's it - this workflow runs automatically on the schedule below.
#
# Note: this reduces cold starts but can't fully eliminate them (Render can
# still restart the service for deploys/maintenance), and GitHub Actions'
# free-tier scheduler can occasionally skip/delay a run by a few minutes.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "${{ secrets.BACKEND_HEALTH_URL }}" ]; then
            echo "BACKEND_HEALTH_URL secret is not set - skipping."
            exit 0
          fi
          curl -sf "${{ secrets.BACKEND_HEALTH_URL }}" || echo "Ping failed (service may be waking up) - not treated as an error."
